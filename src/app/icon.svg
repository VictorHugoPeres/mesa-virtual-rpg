<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#09090b" />
    </linearGradient>
    <linearGradient id="facetGrad" x1="50" y1="36" x2="50" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ef4444" />
      <stop offset="100%" stopColor="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Fundo sutil circular para destaque na aba do navegador -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <!-- Hexágono do D20 -->
  <polygon
    points="50,12 84,31 84,69 50,88 16,69 16,31"
    stroke="#ef4444"
    stroke-width="3.5"
    stroke-linejoin="round"
    fill="#121217"
  />

  <!-- Triângulo central (face frontal) -->
  <polygon
    points="32,38 68,38 50,68"
    stroke="#f87171"
    stroke-width="3"
    stroke-linejoin="round"
    fill="url(#facetGrad)"
  />

  <!-- Arestas internas do icosaedro -->
  <line x1="32" y1="38" x2="50" y2="12" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="32" y1="38" x2="16" y2="31" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="32" y1="38" x2="16" y2="69" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <line x1="68" y1="38" x2="50" y2="12" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="68" y1="38" x2="84" y2="31" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="68" y1="38" x2="84" y2="69" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <line x1="50" y1="68" x2="16" y2="69" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="50" y1="68" x2="50" y2="88" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  <line x1="50" y1="68" x2="84" y2="69" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Número 20 em branco brilhante para leitura perfeita no favicon -->
  <text
    x="50"
    y="49.5"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#ffffff"
    font-size="16"
    font-weight="900"
    font-family="system-ui, -apple-system, sans-serif"
    letter-spacing="-0.5"
  >
    20
  </text>
</svg>
